services:
  postgres:
    image: postgres:16-alpine
    container_name: amplyra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: amplyra
      POSTGRES_PASSWORD: amplyra_dev_password
      POSTGRES_DB: amplyra
    ports:
      - "5432:5432"
    volumes:
      - amplyra_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amplyra -d amplyra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amplyra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - amplyra_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  amplyra_pg_data:
  amplyra_redis_data:
